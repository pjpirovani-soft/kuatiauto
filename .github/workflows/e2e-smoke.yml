name: E2E Smoke (prod)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smokes against prod
        env:
          E2E_PROD_URL: ${{ secrets.E2E_PROD_URL }}
          E2E_USER_PROPIETARIO_EMAIL: ${{ secrets.E2E_USER_PROPIETARIO_EMAIL }}
          E2E_USER_PROPIETARIO_PASSWORD: ${{ secrets.E2E_USER_PROPIETARIO_PASSWORD }}
          E2E_USER_PROPIETARIO_B_EMAIL: ${{ secrets.E2E_USER_PROPIETARIO_B_EMAIL }}
          E2E_USER_PROPIETARIO_B_PASSWORD: ${{ secrets.E2E_USER_PROPIETARIO_B_PASSWORD }}
          E2E_USER_ADMIN_EMAIL: ${{ secrets.E2E_USER_ADMIN_EMAIL }}
          E2E_USER_ADMIN_PASSWORD: ${{ secrets.E2E_USER_ADMIN_PASSWORD }}
          E2E_USER_CONDUCTOR_EMAIL: ${{ secrets.E2E_USER_CONDUCTOR_EMAIL }}
          E2E_USER_CONDUCTOR_PASSWORD: ${{ secrets.E2E_USER_CONDUCTOR_PASSWORD }}
        run: npx playwright test --project=smoke-prod --reporter=list

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 7