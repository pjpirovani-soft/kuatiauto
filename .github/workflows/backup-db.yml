name: Backup DB (Supabase)

on:
  schedule:
    # Domingos 03:00 UTC = domingos 00:00 America/Asuncion (UTC-3)
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: Dump y artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump (roles + schema + data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +'%Y%m%dT%H%M%SZ')
          OUT="backup-${STAMP}"
          mkdir -p "$OUT"

          echo "==> Dump roles"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$OUT/roles.sql" --role-only

          echo "==> Dump schema"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$OUT/schema.sql"

          echo "==> Dump data"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$OUT/data.sql" --data-only --use-copy

          echo "==> Comprimir"
          tar -czf "${OUT}.tar.gz" "$OUT"
          ls -lh "${OUT}.tar.gz"

          echo "BACKUP_FILE=${OUT}.tar.gz" >> "$GITHUB_ENV"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error